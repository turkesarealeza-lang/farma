<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tarefas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <title>Tarefas</title>
</head>
<body>
  <!-- Login -->
  <main id="login" class="login" hidden>
    <img src="icons/icon-192.png" alt="" width="72" height="72">
    <h1>Tarefas</h1>
    <p class="muted">Lembretes que cobram até você fazer.</p>
    <form id="login-form">
      <label>E-mail<input name="email" type="email" autocomplete="username" required></label>
      <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Entrar</button>
      <p class="error" id="login-error"></p>
    </form>
  </main>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <h1>Tarefas</h1>
      <button class="icon-btn" id="open-settings" aria-label="Configurações">⚙️</button>
    </header>

    <div id="banner"></div>

    <main class="list" id="list"></main>

    <form class="composer" id="composer">
      <button type="button" class="icon-btn" id="manual-btn" aria-label="Escolher data manualmente">📅</button>
      <textarea id="composer-text" rows="1" placeholder="Ex: pagar boleto sexta às 10h" enterkeyhint="send"></textarea>
      <button type="button" class="round" id="mic-btn" aria-label="Gravar áudio">🎙️</button>
      <button type="submit" class="round primary" id="send-btn" aria-label="Enviar" hidden>➤</button>
    </form>
  </div>

  <!-- Task editor -->
  <dialog id="editor">
    <form method="dialog" id="editor-form">
      <h2 id="editor-title">Nova tarefa</h2>
      <p class="error" id="editor-error"></p>
      <label>O que fazer<input name="text" required></label>
      <label>Quando<input name="due" type="datetime-local" required></label>
      <div class="row">
        <button type="button" class="danger" id="editor-delete" hidden>Excluir</button>
        <span class="spacer"></span>
        <button type="button" id="editor-cancel">Cancelar</button>
        <button type="submit" class="primary">Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- Snooze -->
  <dialog id="snooze">
    <h2>Adiar</h2>
    <div class="stack">
      <button data-min="15">15 minutos</button>
      <button data-min="30">30 minutos</button>
      <button data-min="60">1 hora</button>
      <button data-min="180">3 horas</button>
      <button data-until="tomorrow">Amanhã às 9h</button>
      <button class="ghost" id="snooze-cancel">Cancelar</button>
    </div>
  </dialog>

  <!-- Settings -->
  <dialog id="settings" class="sheet">
    <div class="row"><h2>Configurações</h2><span class="spacer"></span><button class="icon-btn" id="settings-close" aria-label="Fechar">✕</button></div>
    <section>
      <h3>Notificações</h3>
      <div id="notif-status"></div>
    </section>
    <section>
      <h3>Minha conta</h3>
      <p class="muted" id="me-line"></p>
      <form id="password-form" class="stack">
        <input name="current" type="password" placeholder="Senha atual" autocomplete="current-password" required>
        <input name="new" type="password" placeholder="Nova senha (mín. 8)" autocomplete="new-password" minlength="8" required>
        <button type="submit">Trocar senha</button>
      </form>
    </section>
    <section id="admin-section" hidden>
      <h3>Usuários</h3>
      <ul id="users" class="users"></ul>
      <form id="user-form" class="stack">
        <input name="name" placeholder="Nome" required>
        <input name="email" type="email" placeholder="E-mail" required>
        <input name="password" type="text" placeholder="Senha inicial (mín. 8)" minlength="8" required autocomplete="off">
        <button type="submit">Adicionar usuário</button>
      </form>
    </section>
    <section>
      <button class="danger wide" id="logout">Sair</button>
    </section>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
