{% extends "base.html" %}
{% block title %}Grupos{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-collection"></i> Grupos de Produtos</h4>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header py-2">Grupos Cadastrados</div>
            <div class="table-responsive">
                <table class="table table-hover table-sm mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Codigo</th>
                            <th>Nome</th>
                            <th class="text-center">Acoes</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for g in grupos %}
                        <tr>
                            <td>{{ g.codigo }}</td>
                            <td>{{ g.nome }}</td>
                            <td class="text-center">
                                <form method="POST" action="{{ url_for('grupo_excluir', grupo_id=g.id) }}"
                                      class="d-inline" onsubmit="return confirm('Excluir este grupo?')">
                                    <button type="submit" class="btn btn-outline-danger btn-sm">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        {% else %}
                        <tr><td colspan="3" class="text-center text-muted">Nenhum grupo.</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card">
            <div class="card-header py-2">Novo Grupo</div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('grupo_novo') }}">
                    <div class="mb-2">
                        <label class="form-label form-label-sm">Codigo</label>
                        <input type="number" name="codigo" class="form-control form-control-sm" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label form-label-sm">Nome</label>
                        <input type="text" name="nome" class="form-control form-control-sm" required
                               style="text-transform: uppercase;">
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm">
                        <i class="bi bi-plus-circle"></i> Adicionar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
